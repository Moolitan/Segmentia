[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cskcache-core"
version = "0.1.0"
description = "Context-skill KV cache middleware with probe-gated selective recompute"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
# vLLM integration is optional: the core engine, storage, token, kv_transfer,
# and compute layers import only torch. Install this extra to use the vLLM v1
# KV connector in cskcache.integration.vllm.
vllm = ["vllm"]

[tool.setuptools.packages.find]
include = ["cskcache*"]
